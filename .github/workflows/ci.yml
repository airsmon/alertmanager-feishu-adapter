name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify module
        run: go mod verify

      - name: Run checks
        run: make check

      - name: Build container image
        run: docker build --tag alertmanager-feishu-adapter:ci .
